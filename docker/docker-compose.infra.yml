version: "3"
services:
  mysql8_server:
    image: mysql:8
    container_name: mysql8_server
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: boot-admin
      TZ: Asia/Shanghai
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - ./data/mysql8:/var/lib/mysql
  redis_server:
    image: redis:6
    container_name: redis_server
    ports:
      - "6379:6379"
    command: redis-server --requirepass 123456
    volumes:
      - ./data/redis:/data
  jaeger_server:
    image: jaegertracing/all-in-one:1.56
    container_name: jaeger_server
    environment:
      COLLECTOR_OTLP_ENDABLED: "true"
    ports:
      - 5775:5775/udp
      - 6831:6831/udp
      - 6832:6832/udp
      - 5778:5778
      - 16686:16686
      - 14250:14250
      - 14268:14268
      - 14269:14269
      - 4317:4317
      - 4318:4318
      - 9411:9411